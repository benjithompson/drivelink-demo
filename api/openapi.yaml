openapi: 3.0.3
info:
  title: DriveLink Demo API
  version: 1.0.0
  description: |
    Connected-car API for the DriveLink Demo app. Every response comes from a BlazeMeter virtual service.

    The `X-Scenario` request header selects the behavior of the virtual service. When the header is
    absent, the service uses the `default` scenario. The scenario catalog is in `api/scenarios.yaml`.

    Example conventions (used to build the virtual-service transactions):
    - Each named example has `x-scenario`: the `X-Scenario` value that returns it.
    - `x-match` adds request matchers, for example `X-Poll-Attempt: "^[12]$"` (regex).
    - `x-vin` limits an example to one vehicle.
    - Examples without `x-match` are the fallback for their scenario.

    The API is original. It does not mirror any OEM API.
  contact:
    name: Ben Thompson
servers:
  - url: https://{host}/v1
    description: BlazeMeter virtual service (URL set per endpoint profile)
    variables:
      host:
        default: mock.example.com
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: account
  - name: vehicles
  - name: commands
  - name: charging
  - name: climate
  - name: trips
  - name: maintenance
  - name: alerts
  - name: system

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check for the "Test connection" button
      security: []
      parameters:
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Service is up
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                default:
                  x-scenario: default
                  value:
                    status: UP
                    version: 1.0.0
                    service: drivelink-mock

  /auth/token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Sign in with email and password
      security: []
      parameters:
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              default:
                value:
                  email: alex.rivera@drivelink.test
                  password: demo-password
      responses:
        '200':
          $ref: '#/components/responses/TokenOk'
        '401':
          description: Email or password is not correct
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid-credentials:
                  value:
                    type: https://drivelink.test/problems/invalid-credentials
                    title: Sign-in failed
                    status: 401
                    detail: The email or password is not correct.
                    code: INVALID_CREDENTIALS
                    correlationId: 7f3c91a2-0000-4000-8000-000000000401
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      security: []
      parameters:
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                value:
                  refreshToken: rt-demo-7f3c91a2
      responses:
        '200':
          $ref: '#/components/responses/TokenOk'
        '401':
          description: Refresh token rejected
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                auth-expired:
                  x-scenario: auth-expired
                  value:
                    type: https://drivelink.test/problems/token-expired
                    title: Session expired
                    status: 401
                    detail: The refresh token has expired. Sign in again.
                    code: TOKEN_EXPIRED
                    correlationId: 7f3c91a2-0000-4000-8000-000000000401
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Current user profile and unit preferences
      parameters:
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: User profile
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  x-scenario: default
                  value:
                    userId: usr-1001
                    name: Alex Rivera
                    email: alex.rivera@drivelink.test
                    units:
                      distance: MI
                      temperature: F
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Vehicles on the account
      parameters:
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Vehicle list
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
              examples:
                default:
                  x-scenario: default
                  value:
                    - vin: DLEV26AURA0000101
                      nickname: Aurora
                      model: Aurora EV
                      trim: Limited AWD · Long Range
                      year: 2026
                      color: Glacier Blue
                      powertrain: EV
                      imageKey: crossover-glacier-blue
                    - vin: DLGS25SLACE000202
                      nickname: Solace
                      model: Solace
                      trim: SEL · 2.5L
                      year: 2025
                      color: Ember Red
                      powertrain: ICE
                      imageKey: sedan-ember-red
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/status:
    get:
      tags: [vehicles]
      operationId: getVehicleStatus
      summary: Last known vehicle status
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Vehicle status
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleStatus'
              examples:
                default:
                  $ref: '#/components/examples/StatusDefaultEv'
                default-ice:
                  $ref: '#/components/examples/StatusDefaultIce'
                low-battery:
                  $ref: '#/components/examples/StatusLowBattery'
                door-ajar:
                  $ref: '#/components/examples/StatusDoorAjar'
                tire-low:
                  $ref: '#/components/examples/StatusTireLow'
                vehicle-offline:
                  $ref: '#/components/examples/StatusOffline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No vehicle with this VIN on the account
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknown-vin:
                  x-scenario: default
                  value:
                    type: https://drivelink.test/problems/not-found
                    title: Vehicle not found
                    status: 404
                    detail: No vehicle with this VIN on the account.
                    code: NOT_FOUND
                    correlationId: 7f3c91a2-0000-4000-8000-000000000404
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/commands:
    post:
      tags: [commands]
      operationId: sendCommand
      summary: Queue a remote command; poll the returned command for the result
      description: |
        The virtual service returns fixed example bodies; `type` in the response may differ from the requested type. Clients show the command label from local state.
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
            examples:
              lock:
                value:
                  type: LOCK
                  pin: '1234'
              start-with-climate:
                value:
                  type: START
                  pin: '1234'
                  params:
                    tempMode: SET
                    tempF: 72
                    frontDefrost: true
                    rearDefrost: false
                    heatedSteeringWheel: false
                    heatedSeats: 2
                    durationMin: 10
      responses:
        '202':
          description: Command queued
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              description: URL of the command resource to poll
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
              examples:
                default:
                  x-scenario: default
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: QUEUED
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The PIN is not correct
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid-pin:
                  value:
                    type: https://drivelink.test/problems/invalid-pin
                    title: Incorrect PIN
                    status: 403
                    detail: The PIN is not correct. Try again.
                    code: INVALID_PIN
                    correlationId: 7f3c91a2-0000-4000-8000-000000000403
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Vehicle cannot accept the command
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                vehicle-offline:
                  x-scenario: vehicle-offline
                  value:
                    type: https://drivelink.test/problems/vehicle-offline
                    title: Vehicle is offline
                    status: 409
                    detail: The vehicle has no network connection. Try again when it is in coverage.
                    code: VEHICLE_OFFLINE
                    correlationId: 7f3c91a2-0000-4000-8000-000000000409
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /commands/{commandId}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Poll a remote command
      description: |
        The app polls every 2 s (4 s after attempt 5) and stops after 60 s. It sends the attempt number in
        `X-Poll-Attempt`, so the virtual service can return PENDING for early attempts without state.

        The virtual service returns fixed example bodies; `type` in the response may differ from the requested type. Clients show the command label from local state.
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            example: cmd-5b1e7c40
        - name: X-Poll-Attempt
          in: header
          required: true
          description: Poll count, starting at 1
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Command state
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
              examples:
                default-pending:
                  x-scenario: default
                  x-match:
                    X-Poll-Attempt: '^[12]$'
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:02Z'
                default:
                  x-scenario: default
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: SUCCEEDED
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:06Z'
                fast:
                  x-scenario: fast
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: SUCCEEDED
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:01Z'
                slow-vehicle-pending:
                  x-scenario: slow-vehicle
                  x-match:
                    X-Poll-Attempt: '^[1-8]$'
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:10Z'
                slow-vehicle:
                  x-scenario: slow-vehicle
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: SUCCEEDED
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:28Z'
                vehicle-asleep-waking:
                  x-scenario: vehicle-asleep
                  x-match:
                    X-Poll-Attempt: '^[12]$'
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    reason: WAKING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:02Z'
                vehicle-asleep-pending:
                  x-scenario: vehicle-asleep
                  x-match:
                    X-Poll-Attempt: '^[34]$'
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:06Z'
                vehicle-asleep:
                  x-scenario: vehicle-asleep
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: SUCCEEDED
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:10Z'
                command-fails-pending:
                  x-scenario: command-fails
                  x-match:
                    X-Poll-Attempt: '^1$'
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:02Z'
                command-fails:
                  x-scenario: command-fails
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: FAILED
                    reason: DOOR_OPEN
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:04Z'
                command-timeout:
                  x-scenario: command-timeout
                  value:
                    commandId: cmd-5b1e7c40
                    type: LOCK
                    status: PENDING
                    createdAt: '2026-10-02T17:00:00Z'
                    updatedAt: '2026-10-02T17:00:02Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/location:
    get:
      tags: [vehicles]
      operationId: getVehicleLocation
      summary: Last known vehicle location
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Location
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
              examples:
                default:
                  x-scenario: default
                  value:
                    lat: 33.6189
                    lon: -117.9298
                    accuracyM: 8
                    address: 120 Marina Way, Harbor District
                    locality: Harbor District
                    updatedAt: '2026-10-02T16:58:00Z'
                default-ice:
                  x-scenario: default
                  x-vin: DLGS25SLACE000202
                  value:
                    lat: 33.6412
                    lon: -117.9187
                    accuracyM: 12
                    address: 455 Cypress Avenue, Old Town
                    locality: Old Town
                    updatedAt: '2026-10-02T16:40:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/charge-settings:
    get:
      tags: [charging]
      operationId: getChargeSettings
      summary: Charge limits and schedules (EV and HYBRID only)
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Charge settings
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeSettings'
              examples:
                default:
                  $ref: '#/components/examples/ChargeSettingsDefault'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The vehicle does not support charging (ICE), or the VIN is unknown
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ice-no-charging:
                  x-scenario: default
                  x-vin: DLGS25SLACE000202
                  value:
                    type: https://drivelink.test/problems/not-supported
                    title: Not supported
                    status: 404
                    detail: This vehicle does not support charging.
                    code: NOT_FOUND
                    correlationId: 7f3c91a2-0000-4000-8000-000000000404
                unknown-vin:
                  x-scenario: default
                  value:
                    type: https://drivelink.test/problems/not-found
                    title: Vehicle not found
                    status: 404
                    detail: No vehicle with this VIN on the account.
                    code: NOT_FOUND
                    correlationId: 7f3c91a2-0000-4000-8000-000000000404
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [charging]
      operationId: updateChargeSettings
      summary: Update charge limits and schedules
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeSettings'
            examples:
              default:
                $ref: '#/components/examples/ChargeSettingsDefault'
      responses:
        '200':
          description: Updated charge settings
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeSettings'
              examples:
                default:
                  $ref: '#/components/examples/ChargeSettingsDefault'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The vehicle does not support charging (ICE), or the VIN is unknown
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ice-no-charging:
                  x-scenario: default
                  x-vin: DLGS25SLACE000202
                  value:
                    type: https://drivelink.test/problems/not-supported
                    title: Not supported
                    status: 404
                    detail: This vehicle does not support charging.
                    code: NOT_FOUND
                    correlationId: 7f3c91a2-0000-4000-8000-000000000404
                unknown-vin:
                  x-scenario: default
                  value:
                    type: https://drivelink.test/problems/not-found
                    title: Vehicle not found
                    status: 404
                    detail: No vehicle with this VIN on the account.
                    code: NOT_FOUND
                    correlationId: 7f3c91a2-0000-4000-8000-000000000404
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/climate-presets:
    get:
      tags: [climate]
      operationId: getClimatePresets
      summary: Saved remote-start presets (up to 4)
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Presets
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClimatePresets'
              examples:
                default:
                  $ref: '#/components/examples/ClimatePresetsDefault'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [climate]
      operationId: updateClimatePresets
      summary: Replace the saved presets
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/XScenario'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClimatePresets'
            examples:
              default:
                $ref: '#/components/examples/ClimatePresetsDefault'
      responses:
        '200':
          description: Updated presets
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClimatePresets'
              examples:
                default:
                  $ref: '#/components/examples/ClimatePresetsDefault'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /vehicles/{vin}/trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: Recent trips, newest first
      parameters:
        - $ref: '#/components/parameters/Vin'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
