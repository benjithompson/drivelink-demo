    TokenResponse:
      type: object
      required: [accessToken, expiresIn, refreshToken]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds
        refreshToken:
          type: string

    User:
      type: object
      required: [userId, name, email, units]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        units:
          type: object
          required: [distance, temperature]
          properties:
            distance:
              type: string
              enum: [MI, KM]
            temperature:
              type: string
              enum: [F, C]

    Vehicle:
      type: object
      required: [vin, nickname, model, year, powertrain, imageKey]
      properties:
        vin:
          $ref: '#/components/schemas/Vin'
        nickname:
          type: string
        model:
          type: string
        trim:
          type: string
        year:
          type: integer
        color:
          type: string
        powertrain:
          $ref: '#/components/schemas/Powertrain'
        imageKey:
          type: string
          description: Selects the in-app vehicle illustration and paint, for example `crossover-glacier-blue`

    ClimateState:
      type: object
      required: ['on', tempMode]
      properties:
        'on':
          type: boolean
        tempMode:
          $ref: '#/components/schemas/TempMode'
        setTempF:
          type: integer
          minimum: 62
          maximum: 82
          description: Meaningful when tempMode is SET
        frontDefrost:
          type: boolean
        rearDefrost:
          type: boolean
        heatedSteeringWheel:
          type: boolean
        heatedSeats:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 = off, 3 = high

    VehicleStatus:
      type: object
      required: [vin, powertrain, updatedAt, connectivity, locked, engineOn, climate, doors, rangeMi, tires, odometerMi, aux12vOk]
      properties:
        vin:
          $ref: '#/components/schemas/Vin'
        powertrain:
          $ref: '#/components/schemas/Powertrain'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        connectivity:
          type: string
          description: Telematics link state. OFFLINE means the data is the last known state.
          enum: [ONLINE, ASLEEP, OFFLINE]
        locked:
          type: boolean
        engineOn:
          type: boolean
        climate:
          $ref: '#/components/schemas/ClimateState'
        doors:
          type: object
          required: [fl, fr, rl, rr, trunk, hood]
          properties:
            fl: {$ref: '#/components/schemas/OpenClosed'}
            fr: {$ref: '#/components/schemas/OpenClosed'}
            rl: {$ref: '#/components/schemas/OpenClosed'}
            rr: {$ref: '#/components/schemas/OpenClosed'}
            trunk: {$ref: '#/components/schemas/OpenClosed'}
            hood: {$ref: '#/components/schemas/OpenClosed'}
        windows:
          type: object
          properties:
            fl: {$ref: '#/components/schemas/WindowState'}
            fr: {$ref: '#/components/schemas/WindowState'}
            rl: {$ref: '#/components/schemas/WindowState'}
            rr: {$ref: '#/components/schemas/WindowState'}
        fuelPct:
          type: integer
          minimum: 0
          maximum: 100
          description: ICE and HYBRID only
        batteryPct:
          type: integer
          minimum: 0
          maximum: 100
          description: EV and HYBRID only
        rangeMi:
          type: integer
          minimum: 0
        charging:
          $ref: '#/components/schemas/ChargingState'
        tires:
          type: object
          required: [flPsi, frPsi, rlPsi, rrPsi, lowWarning, lowWheels]
          properties:
            flPsi: {type: integer}
            frPsi: {type: integer}
            rlPsi: {type: integer}
            rrPsi: {type: integer}
            lowWarning: {type: boolean}
            lowWheels:
              type: array
              description: Wheels with low pressure. Empty when no tire is low.
              uniqueItems: true
              items:
                $ref: '#/components/schemas/WheelPosition'
        odometerMi:
          type: integer
          minimum: 0
        oilLifePct:
          type: integer
          minimum: 0
          maximum: 100
        aux12vOk:
          type: boolean

    ChargingState:
      type: object
      description: EV and HYBRID only
      required: [pluggedIn, active, state]
      properties:
        pluggedIn:
          type: boolean
        active:
          type: boolean
        state:
          type: string
          description: NOT_PLUGGED when pluggedIn is false. CHARGING when active is true.
          enum: [NOT_PLUGGED, CHARGING, COMPLETE, SCHEDULED]
        chargerType:
          type: string
          description: Present when pluggedIn is true
          enum: [AC, DC]
        rateKw:
          type: number
        minutesToTarget:
          type: integer
        targetPct:
          type: integer
        energyAddedKwh:
          type: number
        costUsd:
          type: number

    CommandType:
      type: string
      enum: [LOCK, UNLOCK, START, STOP, HORN_LIGHTS, LIGHTS, CHARGE_START, CHARGE_STOP]
    ClimateParams:
      type: object
      description: Remote-start options. Used with START and stored in presets.
      required: [tempMode, durationMin]
      properties:
        tempMode:
          $ref: '#/components/schemas/TempMode'
        tempF:
          type: integer
          minimum: 62
          maximum: 82
          description: Required when tempMode is SET
        frontDefrost:
          type: boolean
        rearDefrost:
          type: boolean
        heatedSteeringWheel:
          type: boolean
        heatedSeats:
          type: integer
          minimum: 0
          maximum: 3
        durationMin:
          type: integer
          minimum: 1
          maximum: 10
        presetId:
          type: string
    CommandRequest:
      type: object
      required: [type, pin]
      properties:
        type:
          $ref: '#/components/schemas/CommandType'
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          description: The user's 4-digit PIN. The virtual service accepts any 4 digits.
        params:
          $ref: '#/components/schemas/ClimateParams'
    Command:
      type: object
      required: [commandId, type, status, createdAt, updatedAt]
      properties:
        commandId:
          type: string
        type:
          $ref: '#/components/schemas/CommandType'
        status:
          type: string
          enum: [QUEUED, PENDING, SUCCEEDED, FAILED]
        reason:
          type: string
          description: Sub-state while PENDING (WAKING) or the cause when FAILED
          enum: [WAKING, DOOR_OPEN, HOOD_OPEN, ENGINE_RUNNING, KEY_IN_VEHICLE, LOW_BATTERY, UNKNOWN]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    Location:
      type: object
      required: [lat, lon, accuracyM, updatedAt]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        accuracyM:
          type: integer
        address:
          type: string
        locality:
          type: string
          description: Short area name for the map label, for example "Harbor District"
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    ChargeSettings:
      type: object
      required: [acTargetPct, dcTargetPct, schedules]
      properties:
        acTargetPct:
          type: integer
          minimum: 50
          maximum: 100
          multipleOf: 10
        dcTargetPct:
          type: integer
          minimum: 50
          maximum: 100
          multipleOf: 10
        offPeakMode:
          type: string
          enum: [OFF_PEAK_PRIORITY, OFF_PEAK_ONLY]
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ChargeSchedule'
        departure:
          $ref: '#/components/schemas/Departure'
    ChargeSchedule:
      type: object
      required: [id, days, startTime, endTime, enabled]
      properties:
        id:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
        enabled:
          type: boolean
    Departure:
      type: object
      required: [enabled, days, time]
      properties:
        enabled:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        time:
          $ref: '#/components/schemas/LocalTime'
        climate:
          $ref: '#/components/schemas/ClimateState'

    ClimatePresets:
      type: object
      required: [presets]
      properties:
        presets:
          type: array
          maxItems: 4
          items:
            type: object
            required: [id, name, params]
            properties:
              id:
                type: string
              name:
                type: string
              params:
                $ref: '#/components/schemas/ClimateParams'

    Trip:
      type: object
      required: [id, startedAt, endedAt, distanceMi, durationMin]
      properties:
        id:
          type: string
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        distanceMi:
          type: number
        durationMin:
          type: integer
        avgMph:
          type: number
        efficiency:
          type: number
        efficiencyUnit:
          type: string
          enum: [MI_PER_KWH, MPG]

    Maintenance:
      type: object
      required: [odometerMi, items, recalls]
      properties:
        odometerMi:
          type: integer
        lastService:
          $ref: '#/components/schemas/ServicePoint'
        nextService:
          $ref: '#/components/schemas/ServicePoint'
        intervalMi:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
        recalls:
          type: array
          items:
            $ref: '#/components/schemas/Recall'
        preferredServiceCenter:
          $ref: '#/components/schemas/ServiceCenter'
    ServicePoint:
      type: object
      required: [odometerMi, date]
      properties:
        odometerMi:
          type: integer
        date:
          type: string
          format: date
    ServiceItem:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        dueMi:
          type: integer
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [UPCOMING, DUE, OVERDUE]
    Recall:
      type: object
      required: [id, campaign, title, status]
      properties:
        id:
          type: string
        campaign:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, REMEDIED]
        issuedDate:
          type: string
          format: date
    ServiceCenter:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
          example: '+1 555 0142'
        distanceMi:
          type: number
        hours:
          type: string
        openNow:
          type: boolean
    ServiceRequestCreate:
      type: object
      required: [serviceCenterId, preferredDate]
      properties:
        serviceCenterId:
          type: string
        preferredDate:
          type: string
          format: date
        itemIds:
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 500
    ServiceRequest:
      type: object
      required: [requestId, status]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [REQUESTED, CONFIRMED, DECLINED]

    Alert:
      type: object
      required: [id, type, severity, title, body, createdAt, read]
      properties:
        id:
          type: string
        vin:
          $ref: '#/components/schemas/Vin'
        type:
          type: string
          enum: [DOOR_OPEN, DOOR_UNLOCKED, LOW_TIRE, LOW_RANGE, CHARGE_COMPLETE, THEFT_ALARM, SERVICE_DUE, RECALL]
        severity:
          type: string
          enum: [INFO, WARN, CRITICAL]
        title:
          type: string
        body:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        read:
          type: boolean

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [VEHICLE_OFFLINE, VEHICLE_ASLEEP, COMMAND_CONFLICT, TOKEN_EXPIRED, RATE_LIMITED, INTERNAL, NOT_FOUND, INVALID_REQUEST, INVALID_CREDENTIALS, INVALID_PIN]
        correlationId:
          type: string
