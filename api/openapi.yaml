components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Any non-empty token is accepted, except in the `auth-expired` scenario.

  parameters:
    Vin:
      name: vin
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Vin'
    XScenario:
      name: X-Scenario
      in: header
      required: false
      description: Virtual-service behavior. Absent means `default`. See `api/scenarios.yaml`.
      schema:
        type: string
        enum:
          - default
          - fast
          - slow-vehicle
          - vehicle-asleep
          - vehicle-offline
          - command-fails
          - command-timeout
          - low-battery
          - door-ajar
          - tire-low
          - auth-expired
          - rate-limited
          - server-error
          - bad-payload
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID per request; echoed in the response and in problem bodies
      schema:
        type: string
        format: uuid
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: App version, for example `0.1.0 (1)`
      schema:
        type: string

  headers:
    XCorrelationId:
      description: Echo of the request X-Correlation-Id
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the next request
      schema:
        type: integer

  responses:
    TokenOk:
      description: Tokens issued
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponse'
          examples:
            default:
              x-scenario: default
              value:
                accessToken: at-demo-1c9e44d0
                expiresIn: 3600
                refreshToken: rt-demo-7f3c91a2
    BadRequest:
      description: Request body is not valid
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://drivelink.test/problems/invalid-request
                title: Invalid request
                status: 400
                detail: acTargetPct must be a multiple of 10 between 50 and 100.
                code: INVALID_REQUEST
                correlationId: 7f3c91a2-0000-4000-8000-000000000400
    Unauthorized:
      description: Access token missing or expired
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            auth-expired:
              x-scenario: auth-expired
              value:
                type: https://drivelink.test/problems/token-expired
                title: Session expired
                status: 401
                detail: The access token has expired.
                code: TOKEN_EXPIRED
                correlationId: 7f3c91a2-0000-4000-8000-000000000401
    NotFound:
      description: Resource not found, or the vehicle does not support it (for example charge settings on an ICE vehicle)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: https://drivelink.test/problems/not-found
                title: Not found
                status: 404
                detail: No vehicle with this VIN on the account.
                code: NOT_FOUND
                correlationId: 7f3c91a2-0000-4000-8000-000000000404
    RateLimited:
      description: Too many requests
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate-limited:
              x-scenario: rate-limited
              x-headers:
                Retry-After: '30'
              value:
                type: https://drivelink.test/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Wait 30 seconds before the next request.
                code: RATE_LIMITED
                correlationId: 7f3c91a2-0000-4000-8000-000000000429
    ServerError:
      description: Unexpected server error
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            server-error:
              x-scenario: server-error
              value:
                type: https://drivelink.test/problems/internal
                title: Something went wrong
                status: 500
                detail: The service could not complete the request.
                code: INTERNAL
                correlationId: 7f3c91a2-0000-4000-8000-000000000500

